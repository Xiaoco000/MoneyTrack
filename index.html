<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moneyS - E-Wallet & Social Finance</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .dark .glass-card {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased flex justify-center items-center min-h-screen selection:bg-emerald-500 selection:text-white">

    <!-- Mobile Frame Container -->
    <div class="w-full max-w-md h-screen md:h-[844px] md:rounded-3xl bg-slate-900 shadow-2xl flex flex-col relative overflow-hidden border border-slate-800">

        <!-- LOADING SCREEN -->
        <div id="loadingScreen" class="absolute inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center space-y-4">
            <div class="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-xs text-slate-400 font-mono">Memuat moneyS Final...</p>
        </div>

        <!-- ================= AUTH SECTION ================= -->
        <div id="authView" class="absolute inset-0 bg-slate-900 z-40 flex flex-col justify-center px-6 overflow-y-auto hidden">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-tr from-emerald-500 to-teal-400 rounded-3xl mx-auto flex items-center justify-center text-slate-950 text-2xl font-bold shadow-lg shadow-emerald-500/20 mb-3">
                    mS
                </div>
                <h1 class="text-2xl font-bold tracking-tight">moneyS</h1>
                <p class="text-xs text-slate-400 mt-1">E-Wallet, Sosmed & Pencatat Keuangan</p>
            </div>

            <!-- Form Login -->
            <div id="loginFormContainer" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs text-slate-400 font-medium">Email</label>
                    <input type="email" id="loginEmail" placeholder="nama@email.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div class="space-y-1">
                    <label class="text-xs text-slate-400 font-medium">Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <button onclick="handleLogin()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold py-3 rounded-xl text-xs transition shadow-lg shadow-emerald-500/20">
                    Masuk
                </button>
                <div class="text-center mt-4">
                    <span class="text-xs text-slate-400">Belum punya akun? </span>
                    <button onclick="toggleAuthMode('register')" class="text-xs text-emerald-400 font-semibold hover:underline">Register</button>
                </div>
            </div>

            <!-- Form Register -->
            <div id="registerFormContainer" class="space-y-4 hidden">
                <div class="space-y-1">
                    <label class="text-xs text-slate-400 font-medium">Nama Lengkap</label>
                    <input type="text" id="regName" placeholder="Zuxa" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div class="space-y-1">
                    <label class="text-xs text-slate-400 font-medium">Username (Unik)</label>
                    <input type="text" id="regUsername" placeholder="zuxa" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div class="space-y-1">
                    <label class="text-xs text-slate-400 font-medium">Email</label>
                    <input type="email" id="regEmail" placeholder="nama@email.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div class="space-y-1">
                    <label class="text-xs text-slate-400 font-medium">Password</label>
                    <input type="password" id="regPassword" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <button onclick="handleRegister()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold py-3 rounded-xl text-xs transition shadow-lg shadow-emerald-500/20">
                    Daftar Akun
                </button>
                <div class="text-center mt-4">
                    <span class="text-xs text-slate-400">Sudah punya akun? </span>
                    <button onclick="toggleAuthMode('login')" class="text-xs text-emerald-400 font-semibold hover:underline">Login</button>
                </div>
            </div>
        </div>

        <!-- ================= MAIN APP VIEW ================= -->
        <div id="appView" class="flex flex-col h-full hidden">
            <!-- HEADER SECTION -->
            <header class="px-6 pt-6 pb-4 bg-gradient-to-br from-emerald-600 via-teal-700 to-slate-900 text-white rounded-b-3xl shadow-lg relative shrink-0">
                <div class="flex justify-between items-start">
                    <div>
                        <div id="greetingContainer" class="flex items-center space-x-2 text-emerald-200 text-sm font-medium">
                            <span id="greetingIcon">🌤</span>
                            <span id="greetingText">Selamat Sore</span>
                        </div>
                        <h1 id="userDisplayName" class="text-2xl font-bold mt-1 tracking-tight">Halo, User 👋</h1>
                        <p id="userDisplayUsername" class="text-xs text-emerald-300 font-mono">@username • Level 1</p>
                        
                        <div class="flex items-center space-x-3 mt-2 text-xs text-slate-200">
                            <span id="currentDate"><i class="fa-regular fa-calendar-days mr-1"></i> Rabu, 29 Juli 2026</span>
                            <span>•</span>
                            <span id="clock" class="font-mono font-semibold text-emerald-100"><i class="fa-regular fa-clock mr-1"></i> 20:47 WIB</span>
                        </div>
                    </div>

                    <div class="flex items-center space-x-2">
                        <button onclick="triggerNotification()" class="relative p-2.5 rounded-full bg-white/10 hover:bg-white/20 transition backdrop-blur-md">
                            <i class="fa-regular fa-bell text-sm"></i>
                            <span id="notifBadge" class="absolute top-1 right-1 w-2 h-2 bg-rose-500 rounded-full"></span>
                        </button>
                        <button onclick="handleLogout()" title="Keluar" class="p-2.5 rounded-full bg-rose-500/20 hover:bg-rose-500/40 text-rose-300 transition">
                            <i class="fa-solid fa-power-off text-sm"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- SCROLLABLE FEED & FINANCE CONTENT -->
            <main class="flex-1 overflow-y-auto no-scrollbar px-5 py-5 space-y-6 pb-24">
                <!-- FORM POSTING -->
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl space-y-3">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Buat Postingan Komunitas</h3>
                    <textarea id="postContent" placeholder="Bagikan tips atau target keuanganmu hari ini..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 transition resize-none h-20"></textarea>
                    <div class="flex items-center justify-between">
                        <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl text-xs flex items-center space-x-2 transition">
                            <i class="fa-solid fa-image text-emerald-400"></i>
                            <span id="fileLabel">Pilih Foto</span>
                            <input type="file" id="postImageFile" accept="image/*" class="hidden" onchange="updateFileLabel()">
                        </label>
                        <button onclick="createPost()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold px-4 py-2 rounded-xl text-xs transition">
                            Kirim Post
                        </button>
                    </div>
                </div>

                <!-- LIVE FEED -->
                <div>
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Feed Komunitas</h3>
                    <div id="socialFeed" class="space-y-4">
                        <p class="text-xs text-slate-500 text-center py-4">Memuat data feed...</p>
                    </div>
                </div>
            </main>

            <!-- BOTTOM NAVIGATION -->
            <nav class="absolute bottom-0 left-0 right-0 h-16 bg-slate-900/90 backdrop-blur-lg border-t border-slate-800 px-3 flex justify-around items-center z-50">
                <a href="#" class="flex flex-col items-center text-emerald-400"><i class="fa-solid fa-house text-lg"></i><span class="text-[10px] mt-1 font-medium">Home</span></a>
                <a href="#" class="flex flex-col items-center text-slate-400"><i class="fa-solid fa-globe text-lg"></i><span class="text-[10px] mt-1 font-medium">Social</span></a>
                <button class="w-12 h-12 bg-gradient-to-tr from-emerald-500 to-teal-400 text-slate-950 rounded-full flex items-center justify-center shadow-lg -mt-5 border-4 border-slate-900"><i class="fa-solid fa-plus text-lg font-bold"></i></button>
                <a href="#" class="flex flex-col items-center text-slate-400"><i class="fa-solid fa-comments text-lg"></i><span class="text-[10px] mt-1 font-medium">Chat</span></a>
                <a href="#" class="flex flex-col items-center text-slate-400"><i class="fa-solid fa-wallet text-lg"></i><span class="text-[10px] mt-1 font-medium">Finance</span></a>
                <a href="#" class="flex flex-col items-center text-slate-400"><i class="fa-solid fa-user text-lg"></i><span class="text-[10px] mt-1 font-medium">Profile</span></a>
            </nav>
        </div>

    </div>

    <!-- FIREBASE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmeCv3NIUJ4muU-LV00JFd0ur-06vBiMw",
            authDomain: "moneytracker-a4e12.firebaseapp.com",
            projectId: "moneytracker-a4e12",
            storageBucket: "moneytracker-a4e12.firebasestorage.app",
            messagingSenderId: "671098268223",
            appId: "1:671098268223:web:e155a31c77e4277415268a",
            measurementId: "G-V6HV6P02L0"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let currentUser = null;

        const loadingScreen = document.getElementById('loadingScreen');
        const authView = document.getElementById('authView');
        const appView = document.getElementById('appView');
        const loginFormContainer = document.getElementById('loginFormContainer');
        const registerFormContainer = document.getElementById('registerFormContainer');
        const userDisplayName = document.getElementById('userDisplayName');
        const userDisplayUsername = document.getElementById('userDisplayUsername');
        const socialFeed = document.getElementById('socialFeed');

        window.toggleAuthMode = function(mode) {
            if(mode === 'register') {
                loginFormContainer.classList.add('hidden');
                registerFormContainer.classList.remove('hidden');
            } else {
                registerFormContainer.classList.add('hidden');
                loginFormContainer.classList.remove('hidden');
            }
        }

        window.updateFileLabel = function() {
            const fileInput = document.getElementById('postImageFile');
            const fileLabel = document.getElementById('fileLabel');
            if(fileInput.files.length > 0) {
                fileLabel.innerText = fileInput.files[0].name.substring(0, 15) + '...';
            } else {
                fileLabel.innerText = 'Pilih Foto';
            }
        }

        window.triggerNotification = function() {
            alert("Notifikasi: Tidak ada pesan baru. Semua sistem keuangan aman!");
            document.getElementById('notifBadge').classList.add('hidden');
        }

        onAuthStateChanged(auth, async (user) => {
            loadingScreen.classList.add('hidden');
            if (user) {
                currentUser = user;
                authView.classList.add('hidden');
                appView.classList.remove('hidden');
                userDisplayName.innerText = `Halo, ${user.email.split('@')[0]} 👋`;
                userDisplayUsername.innerText = `@${user.email.split('@')[0]} • Level 1`;
                loadSocialFeed();
            } else {
                currentUser = null;
                appView.classList.add('hidden');
                authView.classList.remove('hidden');
            }
        });

        window.handleLogin = async function() {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (error) {
                alert("Gagal Login: " + error.message);
            }
        }

        window.handleRegister = async function() {
            const name = document.getElementById('regName').value;
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPassword').value;
            
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                await addDoc(collection(db, "users"), {
                    uid: userCredential.user.uid,
                    name,
                    username,
                    createdAt: serverTimestamp()
                });
                alert("Registrasi Berhasil!");
            } catch (error) {
                alert("Gagal Daftar: " + error.message);
            }
        }

        window.handleLogout = async function() {
            await signOut(auth);
        }

        window.createPost = async function() {
            if (!currentUser) return;
            const content = document.getElementById('postContent').value;
            const fileInput = document.getElementById('postImageFile');
            const file = fileInput.files[0];

            if (!content && !file) {
                alert("Tulis sesuatu atau pilih foto untuk diposting!");
                return;
            }

            try {
                let imageUrl = "";
                if (file) {
                    const storageRef = ref(storage, `posts/${currentUser.uid}_${Date.now()}_${file.name}`);
                    const snapshot = await uploadBytes(storageRef, file);
                    imageUrl = await getDownloadURL(snapshot.ref);
                }

                await addDoc(collection(db, "posts"), {
                    uid: currentUser.uid,
                    author: currentUser.email.split('@')[0],
                    content: content,
                    imageUrl: imageUrl,
                    createdAt: serverTimestamp()
                });

                document.getElementById('postContent').value = '';
                fileInput.value = '';
                document.getElementById('fileLabel').innerText = 'Pilih Foto';
                alert("Postingan berhasil dibagikan!");
            } catch (error) {
                alert("Gagal memposting: " + error.message);
            }
        }

        function loadSocialFeed() {
            const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                socialFeed.innerHTML = "";
                if(snapshot.empty) {
                    socialFeed.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">Belum ada postingan di feed.</p>`;
                    return;
                }
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    let imageHtml = data.imageUrl ? `<div class="mt-3 rounded-xl overflow-hidden border border-slate-800"><img src="${data.imageUrl}" class="w-full h-auto object-cover max-h-60"></div>` : '';
                    
                    socialFeed.innerHTML += `
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-2 shadow-md">
                            <div class="flex items-center space-x-2">
                                <div class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xs">
                                    ${data.author.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <h4 class="text-xs font-bold text-slate-200">@${data.author}</h4>
                                    <span class="text-[10px] text-slate-500">Baru saja</span>
                                </div>
                            </div>
                            <p class="text-xs text-slate-300 leading-relaxed">${data.content || ''}</p>
                            ${imageHtml}
                        </div>
                    `;
                });
            });
        }

        function updateDateTime() {
            const now = new Date();
