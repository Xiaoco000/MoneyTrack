<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>moneyS - E-Wallet & Social Finance</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom Cyber Metallic CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 antialiased flex justify-center items-center min-h-screen selection:bg-cyan-500 selection:text-slate-950">

    <!-- Mobile Frame Container -->
    <div class="w-full max-w-md h-screen md:h-[844px] md:rounded-3xl bg-slate-900 shadow-2xl flex flex-col relative overflow-hidden border border-slate-700/50">

        <!-- LOADING SCREEN -->
        <div id="loadingScreen" class="absolute inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center space-y-4">
            <div class="w-12 h-12 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin shadow-[0_0_15px_rgba(34,211,238,0.5)]"></div>
            <p class="text-xs text-cyan-400 font-mono tracking-widest">INITIALIZING CYBER SYSTEM...</p>
        </div>

        <!-- ================= AUTH SECTION ================= -->
        <div id="authView" class="absolute inset-0 bg-slate-900 z-40 flex flex-col justify-center px-6 overflow-y-auto hidden">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-3xl mx-auto flex items-center justify-center text-slate-950 text-2xl font-bold shadow-[0_0_25px_rgba(6,182,212,0.4)] mb-3 border border-cyan-300/40">
                    mS
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-100">moneyS</h1>
                <p class="text-xs text-slate-400 mt-1 font-mono">CYBERNETIC E-WALLET & FINANCE</p>
            </div>

            <!-- Form Login -->
            <div id="loginFormContainer" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-xs text-cyan-400/80 font-mono">EMAIL</label>
                    <input type="email" id="loginEmail" placeholder="nama@email.com" class="w-full cyber-input rounded-xl px-4 py-3 text-xs focus:outline-none">
                </div>
                <div class="space-y-1">
                    <label class="text-xs text-cyan-400/80 font-mono">PASSWORD</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" class="w-full cyber-input rounded-xl px-4 py-3 text-xs focus:outline-none">
                </div>
                <button onclick="handleLogin()" class="w-full cyber-button text-slate-950 font-bold py-3 rounded-xl text-xs tracking-wider uppercase">
                    Akses Sistem
                </button>
                <div class="text-center mt-4">
                    <span class="text-xs text-slate-400">Belum punya akun? </span>
                    <button onclick="toggleAuthMode('register')" class="text-xs text-cyan-400 font-semibold hover:underline">Register</button>
                </div>
            </div>

            <!-- Form Register -->
            <div id="registerFormContainer" class="space-y-4 hidden">
                <div class="space-y-1">
                    <label class="text-xs text-cyan-400/80 font-mono">NAMA LENGKAP</label>
                    <input type="text" id="regName" placeholder="Zuxa" class="w-full cyber-input rounded-xl px-4 py-3 text-xs focus:outline-none">
                </div>
                <div class="space-y-1">
                    <label class="text-xs text-cyan-400/80 font-mono">USERNAME</label>
                    <input type="text" id="regUsername" placeholder="zuxa" class="w-full cyber-input rounded-xl px-4 py-3 text-xs focus:outline-none">
                </div>
                <div class="space-y-1">
                    <label class="text-xs text-cyan-400/80 font-mono">EMAIL</label>
                    <input type="email" id="regEmail" placeholder="nama@email.com" class="w-full cyber-input rounded-xl px-4 py-3 text-xs focus:outline-none">
                </div>
                <div class="space-y-1">
                    <label class="text-xs text-cyan-400/80 font-mono">PASSWORD</label>
                    <input type="password" id="regPassword" placeholder="••••••••" class="w-full cyber-input rounded-xl px-4 py-3 text-xs focus:outline-none">
                </div>
                <button onclick="handleRegister()" class="w-full cyber-button text-slate-950 font-bold py-3 rounded-xl text-xs tracking-wider uppercase">
                    Daftar Akun
                </button>
                <div class="text-center mt-4">
                    <span class="text-xs text-slate-400">Sudah punya akun? </span>
                    <button onclick="toggleAuthMode('login')" class="text-xs text-cyan-400 font-semibold hover:underline">Login</button>
                </div>
            </div>
        </div>

        <!-- ================= MAIN APP VIEW ================= -->
        <div id="appView" class="flex flex-col h-full hidden">
            <!-- HEADER SECTION -->
            <header class="px-6 pt-6 pb-4 metallic-header text-white rounded-b-3xl relative shrink-0">
                <div class="flex justify-between items-start">
                    <div>
                        <div id="greetingContainer" class="flex items-center space-x-2 text-cyan-300 text-xs font-mono">
                            <span id="greetingIcon">⚡</span>
                            <span id="greetingText">SYSTEM ACTIVE</span>
                        </div>
                        <h1 id="userDisplayName" class="text-xl font-bold mt-1 tracking-tight text-slate-100">Halo, User 👋</h1>
                        <p id="userDisplayUsername" class="text-[11px] text-cyan-400 font-mono">@username • Lv.1 Operator</p>
                        
                        <div class="flex items-center space-x-3 mt-2 text-[11px] text-slate-300 font-mono">
                            <span id="currentDate"><i class="fa-regular fa-calendar-days mr-1"></i> Rabu, 29 Jul 2026</span>
                            <span>•</span>
                            <span id="clock" class="text-cyan-300"><i class="fa-regular fa-clock mr-1"></i> 20:47:25</span>
                        </div>
                    </div>

                    <div class="flex items-center space-x-2">
                        <button onclick="triggerNotification()" class="relative p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 transition border border-slate-600/50">
                            <i class="fa-regular fa-bell text-sm text-cyan-400"></i>
                            <span id="notifBadge" class="absolute top-1 right-1 w-2 h-2 bg-cyan-400 rounded-full shadow-[0_0_8px_rgba(34,211,238,1)]"></span>
                        </button>
                        <button onclick="handleLogout()" title="Keluar" class="p-2.5 rounded-xl bg-rose-950/40 hover:bg-rose-900/60 text-rose-400 transition border border-rose-800/50">
                            <i class="fa-solid fa-power-off text-sm"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- SCROLLABLE FEED & FINANCE CONTENT -->
            <main class="flex-1 overflow-y-auto no-scrollbar px-5 py-5 space-y-5 pb-24">
                <!-- FORM POSTING -->
                <div class="metallic-card p-4 rounded-2xl space-y-3">
                    <h3 class="text-xs font-mono font-semibold text-cyan-400 uppercase tracking-wider">Broadcast Komunitas</h3>
                    <textarea id="postContent" placeholder="Bagikan analisis atau target finansialmu..." class="w-full cyber-input rounded-xl p-3 text-xs focus:outline-none resize-none h-20"></textarea>
                    <div class="flex items-center justify-between">
                        <label class="cursor-pointer bg-slate-800/80 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl text-xs flex items-center space-x-2 transition border border-slate-700 font-mono">
                            <i class="fa-solid fa-image text-cyan-400"></i>
                            <span id="fileLabel">Pilih Media</span>
                            <input type="file" id="postImageFile" accept="image/*" class="hidden" onchange="updateFileLabel()">
                        </label>
                        <button onclick="createPost()" class="cyber-button text-slate-950 font-bold px-4 py-2 rounded-xl text-xs uppercase tracking-wider">
                            Broadcast
                        </button>
                    </div>
                </div>

                <!-- LIVE FEED -->
                <div>
                    <h3 class="text-xs font-mono font-semibold text-cyan-400 uppercase tracking-wider mb-3">Feed Jaringan</h3>
                    <div id="socialFeed" class="space-y-4">
                        <p class="text-xs text-slate-500 text-center py-4 font-mono">Menerima transmisi data...</p>
                    </div>
                </div>
            </main>

            <!-- BOTTOM NAVIGATION -->
            <nav class="absolute bottom-0 left-0 right-0 h-16 bg-slate-900/95 backdrop-blur-xl border-t border-slate-800 px-3 flex justify-around items-center z-50">
                <a href="#" class="flex flex-col items-center text-cyan-400"><i class="fa-solid fa-house text-lg"></i><span class="text-[10px] mt-1 font-mono font-medium">Home</span></a>
                <a href="#" class="flex flex-col items-center text-slate-400 hover:text-cyan-300"><i class="fa-solid fa-globe text-lg"></i><span class="text-[10px] mt-1 font-mono font-medium">Social</span></a>
                <button class="w-12 h-12 cyber-button text-slate-950 rounded-full flex items-center justify-center shadow-lg -mt-5 border border-cyan-300"><i class="fa-solid fa-plus text-lg font-bold"></i></button>
                <a href="#" class="flex flex-col items-center text-slate-400 hover:text-cyan-300"><i class="fa-solid fa-comments text-lg"></i><span class="text-[10px] mt-1 font-mono font-medium">Chat</span></a>
                <a href="#" class="flex flex-col items-center text-slate-400 hover:text-cyan-300"><i class="fa-solid fa-wallet text-lg"></i><span class="text-[10px] mt-1 font-mono font-medium">Finance</span></a>
                <a href="#" class="flex flex-col items-center text-slate-400 hover:text-cyan-300"><i class="fa-solid fa-user text-lg"></i><span class="text-[10px] mt-1 font-mono font-medium">Profile</span></a>
            </nav>
        </div>

    </div>

    <!-- External Script JS -->
    <script type="module" src="script.js"></script>
</body>
  </html>
