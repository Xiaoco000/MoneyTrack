<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoneyS - Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- AUTH SECTION (LOGIN) -->
  <div id="authSection">
    <div class="auth-card">
      <div class="toast-bar" id="customToast">
        <span id="toastIcon">⚡</span> <span id="toastMsg">Pemberitahuan</span>
      </div>
      <h3 id="loginGreeting">Halo! Selamat Datang</h3>
      <p id="loginClock" style="color: var(--primary-neon); font-size: 0.9rem; margin: 4px 0;">00:00:00 WIB</p>
      <p id="loginDate" style="color: var(--text-muted); font-size: 0.8rem;">Hari, Tanggal</p>
      
      <div class="logo-box">
        <h2>MoneyS ☕</h2>
        <p style="color: var(--text-muted); font-size: 0.85rem;">Smart Financial & Community Hub</p>
      </div>

      <input type="text" id="loginIdentifierInput" placeholder="Masukkan Email atau No. HP Anda...">
      
      <button type="button" id="gmailLoginBtn" class="btn-login">📧 LOG IN WITH GMAIL</button>
      <button type="button" id="otpLoginBtn" class="btn-login">🔑 LOGIN VIA GOOGLE OTP EMAIL</button>
      <button type="button" id="phoneLoginBtn" class="btn-login">📱 LOGIN LEWAT NOMOR TELEPON</button>

      <small style="color: var(--text-muted); display: block; margin-top: 15px;">By continuing you agree to our <b>Terms & Privacy Policy</b></small>
    </div>
  </div>

  <!-- APP SECTION (DITAMPILKAN SETELAH LOGIN) -->
  <div id="appSection" class="hidden">
    <!-- Header App -->
    <header class="app-header">
      <div class="user-info">
        <div class="avatar" id="userAvatarText">U</div>
        <div>
          <h4 id="displayUsername" style="font-size: 0.95rem;">Username</h4>
          <span id="homeGreeting" style="font-size: 0.75rem; color: var(--text-muted);">Selamat Datang</span>
        </div>
      </div>
      <div style="text-align: right;">
        <span id="homeClock" style="font-size: 0.8rem; color: var(--primary-neon); display: block;">00:00:00</span>
        <button id="logoutBtn" class="btn-logout">Logout</button>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="app-content">
      <!-- Tab Home -->
      <div id="tabHome" class="tab-pane">
        <div style="background: var(--card-bg); border: 1px solid var(--border-neon); padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 16px;">
          <h3 style="font-size: 0.9rem; color: var(--text-muted);">Total Saldo</h3>
          <h1 id="balance" style="color: var(--primary-neon); margin: 10px 0;">Rp 0</h1>
          <div style="display: flex; justify-content: space-around; font-size: 0.8rem; margin-top: 10px;">
            <div>Pemasukan: <span id="income" style="color:#00ff88;">Rp 0</span></div>
            <div>Pengeluaran: <span id="expense" style="color:#ff3366;">Rp 0</span></div>
          </div>
        </div>
        <ul id="transactionList" style="list-style: none;"></ul>
      </div>

      <!-- Tab Transaksi -->
      <div id="tabTrans" class="tab-pane hidden">
        <form id="transactionForm" style="display: flex; flex-direction: column; gap: 10px;">
          <input type="text" id="title" placeholder="Nama Transaksi" required style="padding: 12px; border-radius: 10px; border: 1px solid var(--border-neon); background: rgba(255,255,255,0.05); color: #fff;">
          <input type="number" id="amount" placeholder="Nominal (Rp)" required style="padding: 12px; border-radius: 10px; border: 1px solid var(--border-neon); background: rgba(255,255,255,0.05); color: #fff;">
          <select id="type" style="padding: 12px; border-radius: 10px; border: 1px solid var(--border-neon); background: #0b1120; color: #fff;">
            <option value="income">Pemasukan (+)</option>
            <option value="expense">Pengeluaran (-)</option>
          </select>
          <button type="submit" class="btn-login" style="margin-top: 10px;">Simpan Transaksi</button>
        </form>
      </div>

      <!-- Tab Chat Messenger -->
      <div id="tabChat" class="tab-pane hidden"></div>

      <!-- Tab Grup -->
      <div id="tabGroup" class="tab-pane hidden">
        <div id="groupList"></div>
      </div>
    </main>

    <!-- Navigation Bar -->
    <nav class="bottom-nav">
      <button class="nav-item active" onclick="switchTab('tabHome')">🏠 <span>Home</span></button>
      <button class="nav-item" onclick="switchTab('tabTrans')">➕ <span>Transaksi</span></button>
      <button class="nav-item" onclick="switchTab('tabGroup')">👥 <span>Grup</span></button>
      <button class="nav-item" onclick="switchTab('tabChat')">💬 <span>Pesan</span></button>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
